# Proxies access to services behind Red Hat's corporate VPN.
#

- name: Configure CSB host to proxy services
  hosts: csb.home.arpa

  roles:

    - role: mta
      vars:
        mta_relay_user: mbarnes@fastmail.com
        mta_relay_host: smtp.fastmail.com
        mta_relay_pass: !vault |
          $ANSIBLE_VAULT;1.1;AES256
          62343439393339356336616432366238326266616263306535333732346234656461653734306632
          6630646635393239313437393136333136313534303165300a373161326236306234656137646366
          65386338656161326134353666393062616230393362646266666263353135386161396134333038
          3234313162666233320a383161626362623634623333326531353839656331326636383032653531
          35326137313133383230336634643339636364313063313665376137663531666435
        mta_user_forward: mbarnes@fastmail.com

    - role: usbip_client
      when: usbip_client | default(False)

    - role: fedora_csb_proxy
