---
- name: Add necessary packages
  ansible.builtin.package:
    name: "{{ redhat_ipa_packages_by_os_family[ansible_os_family] }}"
    state: present
  become: true

# On CSB hosts Kerberos is configured on install.
- name: Configure Kerberos for Red Hat IPA
  when: ansible_os_family != 'RedHat'
  block:

    - name: Add directory for Kerberos configuration
      ansible.builtin.file:
        path: /etc/krb5.conf.d
        state: directory
        mode: u=rwx,g=rx,o=rx
      become: true

    # From https://gitlab.corp.redhat.com/it-iam/system-configs/-/raw/master/krb5/idm/linux-krb5.conf
    # With these modifications:
    # - Add renew_lifetime = 7d
    # - Use default credentials cache (FILE:/tmp/krb5cc_%{uid})
    - name: Add Red Hat Kerberos configuration
      ansible.builtin.copy:
        src: krb5.conf
        dest: /etc/
        mode: u=rw,g=r,o=r
        owner: root
        group: root
      become: true

# The path unit does not work on CSB hosts since they store
# credentials in the Kerberos Cache Manager (KCM) instead of
# basic cache files. But it's harmless to install and start.
- name: Add systemd units for automatic Kerberos renewal
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ xdg_config_home }}/systemd/user/"
    mode: u=rw,g=rw,o=r
  loop:
    - krenew.path
    - krenew.service

- name: Start automatic Kerberos renewal
  ansible.builtin.systemd_service:
    name: krenew.path
    daemon_reload: true
    enabled: true
    state: started
    scope: user

# This assumes the default keyring is already unlocked.
- name: Add the Red Hat IPA password to the default keyring  # noqa: no-changed-when
  ansible.builtin.command:
    argv:
      - secret-tool
      - store
      - --label
      - "Red Hat IPA Password"
      - redhat
      - ipa
    stdin: "{{ redhat_ipa_pass | mandatory }}"
    stdin_add_newline: false

- name: Add kinit-redhat shell script
  ansible.builtin.copy:
    src: kinit-redhat
    dest: "{{ ansible_user_dir }}/.local/bin/"
    mode: u=rwx,g=rx,o=rx

- name: Add daily Kerberos ticket cron job
  ansible.builtin.cron:
    name: Acquire Kerberos ticket
    special_time: daily
    job: "{{ ansible_user_dir }}/.local/bin/kinit-redhat > /dev/null"
