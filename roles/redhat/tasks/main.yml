---
- name: Begin Red Hat configuration
  become: true
  block:

    # ca-certificates to ensure /etc/ssl/certs/ exists
    - name: Add necessary packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - network-manager-openvpn

    - name: Install systemd-resolved
      ansible.builtin.apt:
        name:
          - systemd-resolved
      register: redhat_install_systemd_resolved

    # XXX Workaround for https://bugs.debian.org/1092805
    #     systemd-resolved.service must be restarted after install
    #     for it to be usable. We need to do this immediately, not
    #     as a handler.
    - name: Restart systemd-resolved
      ansible.builtin.systemd_service:
        name: systemd-resolved.service
        state: restarted
      when: redhat_install_systemd_resolved.changed # noqa: no-handler

    # Root CA and openvpn profiles copied from:
    # https://gitlab.consulting.redhat.com/ckuperst/debian-ubuntu-popos-redhat-internal-vpn/

    - name: Add Red Hat IT Root Certificate Authority
      ansible.builtin.copy:
        src: 2022-IT-Root-CA.pem
        dest: /etc/ssl/certs
        mode: u=rw,g=r,o=r
        owner: root
        group: root

- name: Add proxy.pac file for Mozilla Firefox
  ansible.builtin.copy:
    src: proxy.pac
    dest: "{{ redhat_proxy_autoconfig_path }}"
    mode: u=rw,g=rw,o=r
  when: ansible_distribution == 'Debian'

- name: Add helpful shell aliases
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ common_user_bash_aliases_dir }}/"
    mode: u=rw,g=rw,o=r
  loop:
    - kerberos
    - tmux-sessions

- name: Add helpful shell scripts
  ansible.builtin.copy:
    src: rhsso
    dest: "{{ ansible_user_dir }}/.local/bin/"
    mode: u=rwx,g=rx,o=rx

- name: Configure git proxy for gitlab.cee.redhat.com
  community.general.git_config:
    name: http.https://gitlab.cee.redhat.com.proxy
    scope: global
    value: "{{ redhat_csb_proxy }}"

- name: Install yubikey_export bash script
  ansible.builtin.copy:
    src: yubikey_export
    dest: "{{ ansible_user_dir }}/.local/bin/yubikey_export"
    mode: u=rwx,g=rwx,o=rx
  when: usbip_server | default(False)

- name: Install a bash alias for exporting a YubiKey
  ansible.builtin.copy:
    content: |
      alias yubikey_export_{{ item.split('.') | first }}="yubikey_export {{ hostvars[item]['yubikey_usb_id'] }} {{ item }}"
    dest: "{{ common_user_bash_aliases_dir }}/yubikey_export_{{ item.split('.') | first }}"
    mode: u=rw,g=rw,o=r
  loop: "{{ groups['all'] }}"
  when:
    - usbip_server | default(False)
    - "'usbip_client' in hostvars[item]"
    - "'yubikey_usb_id' in hostvars[item]"
