---
- name: Install Fedora CSB customizations
  ansible.builtin.copy:
    src: csb-fedora.yml
    dest: "{{ xdg_config_home }}/"
    mode: u=rw,g=r,o=r

# Filters QEMU and Virtio devices from output
- name: Install an lspci wrapper script
  ansible.builtin.copy:
    src: lspci
    dest: /usr/local/bin/
    mode: u=rwx,g=rx,o=rx
    owner: root
    group: root
